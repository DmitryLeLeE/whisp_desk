name: Release (Windows exe)
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: write
env:
  AUTO_EDITOR_VERSION: "29.3.1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller pillow pytest httpx

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Icon
        run: python tools/make_icon.py

      - name: FFmpeg (GPL build, libx264 + libass)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-dl
          $bin = (Get-ChildItem ffmpeg-dl -Directory | Select-Object -First 1).FullName + "\bin"
          New-Item -ItemType Directory -Force tools/ffmpeg, tools/ffprobe | Out-Null
          Copy-Item "$bin\ffmpeg.exe" tools/ffmpeg/
          Copy-Item "$bin\ffprobe.exe" tools/ffprobe/

      - name: Auto-Editor
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force tools/auto-editor | Out-Null
          $url = "https://github.com/WyattBlue/auto-editor/releases/download/$env:AUTO_EDITOR_VERSION/auto-editor-windows-amd64.exe"
          Invoke-WebRequest $url -OutFile tools/auto-editor/auto-editor.exe

      - name: Tests (with real ffmpeg and Auto-Editor)
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools\ffmpeg;$PWD\tools\ffprobe;$PWD\tools\auto-editor;$env:PATH"
          python -m pytest backend/tests -q

      - name: PyInstaller
        run: python -m PyInstaller --noconfirm --clean whisp_desk.spec

      - name: Bundle tools next to exe
        shell: pwsh
        run: |
          $d = "dist/WHISP_MEDIA_DESK"
          foreach ($t in "ffmpeg","ffprobe","auto-editor") {
            New-Item -ItemType Directory -Force "$d/tools/$t" | Out-Null
            Copy-Item "tools/$t/*.exe" "$d/tools/$t/"
          }
          Copy-Item README.md, LICENSE, CHANGELOG.md $d
          Copy-Item -Recurse docs $d/docs

      - name: Smoke test of the built exe
        shell: pwsh
        run: |
          $p = Start-Process "dist/WHISP_MEDIA_DESK/WHISP_MEDIA_DESK.exe" -ArgumentList "--no-browser","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..30) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/system"; if ($r.ffmpeg.available) { $ok = $true; break } } catch {}
          }
          Stop-Process $p -Force
          if (-not $ok) { throw "exe не поднял сервер или не нашёл ffmpeg" }

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/WHISP_MEDIA_DESK -DestinationPath WHISP_MEDIA_DESK-windows.zip

      - uses: actions/upload-artifact@v4
        with: { name: WHISP_MEDIA_DESK-windows, path: WHISP_MEDIA_DESK-windows.zip }

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: WHISP_MEDIA_DESK-windows.zip
          generate_release_notes: true
