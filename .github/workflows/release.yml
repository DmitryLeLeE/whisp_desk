name: Release (Windows exe)
on:
  push:
    tags: ["v*"]
    branches: [feat/mvp-pipeline]   # сборка и проверка exe без публикации релиза
  workflow_dispatch:
permissions:
  contents: write
env:
  AUTO_EDITOR_VERSION: "29.3.1"
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip, cache-dependency-path: backend/requirements.txt }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: npm, cache-dependency-path: frontend/package-lock.json }

      - name: Python dependencies
        run: python -m pip install -r backend/requirements.txt pyinstaller pillow pytest httpx

      - name: Frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Icon
        run: python tools/make_icon.py

      - name: FFmpeg and Auto-Editor (tools/)
        shell: pwsh
        run: ./tools/fetch_tools.ps1 -AutoEditorVersion $env:AUTO_EDITOR_VERSION

      - name: Tests (with real ffmpeg and Auto-Editor)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          $env:PATH = "$PWD\tools\ffmpeg;$PWD\tools\ffprobe;$PWD\tools\auto-editor;$env:PATH"
          python -m pytest backend/tests -q

      - name: PyInstaller (single exe)
        run: python -m PyInstaller --noconfirm --clean whisp_desk.spec

      - name: Exe size
        shell: pwsh
        run: |
          $f = Get-Item dist/WHISP_MEDIA_DESK.exe
          "{0:N0} MB" -f ($f.Length / 1MB)

      - name: Smoke test, server mode (--no-window)
        shell: pwsh
        run: |
          $p = Start-Process "dist/WHISP_MEDIA_DESK.exe" -ArgumentList "--no-window","--port","8799" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod "http://127.0.0.1:8799/api/system"; if ($r.ffmpeg.available -and $r.auto_editor.available) { $ok = $true; break } } catch {}
          }
          if ($ok) { Invoke-RestMethod "http://127.0.0.1:8799/api/whisp/models" | ConvertTo-Json -Depth 4 | Select-Object -First 30 }
          Stop-Process $p -Force
          if (-not $ok) { throw "exe не поднял сервер или не нашёл встроенные ffmpeg/Auto-Editor" }

      - name: Smoke test, real Whisp from the exe (SAPI speech + tiny model)
        shell: pwsh
        timeout-minutes: 8
        run: |
          Add-Type -AssemblyName System.Speech
          $s = New-Object System.Speech.Synthesis.SpeechSynthesizer
          $wav = Join-Path $PWD "speech.wav"
          $s.SetOutputToWaveFile($wav); $s.Speak("Hello. This is a test of the speech recognition system."); $s.Dispose()
          $out = Join-Path $PWD "whisp_out"; New-Item -ItemType Directory -Force $out | Out-Null
          $params = @{ source=$wav; out_dir=$out; model="tiny"; language="en"; device="cpu"; task="transcribe"; translate_to="";
                      vad=$true; audio_stream=0; max_line_chars=0; max_lines=2; max_duration=0.0; model_dir=$null; stem="whisp" } | ConvertTo-Json -Compress
          $env:PATH = "$PWD\tools\ffmpeg;$PWD\tools\ffprobe;$env:PATH"
          $arg = $params.Replace('"', '\"')
          $env:WHISP_RUNNER_LOG = Join-Path $PWD "whisp_log.txt"
          $p = Start-Process "dist/WHISP_MEDIA_DESK.exe" -ArgumentList "--whisp-run","transcribe",$arg -PassThru
          if (-not $p.WaitForExit(300000)) { $p.Kill(); Get-Content whisp_log.txt -ErrorAction SilentlyContinue | Select-Object -Last 20; throw "Whisp из exe не завершился за 5 минут" }
          "exit code: $($p.ExitCode)"
          Get-Content whisp_log.txt -ErrorAction SilentlyContinue | Select-Object -Last 15
          $srt = Join-Path $out "whisp.srt"
          if (-not (Test-Path $srt)) { throw "Whisp из exe не создал SRT" }
          Get-Content $srt -Encoding utf8
          if ((Get-Content $srt -Raw) -notmatch "(?i)test|speech|hello") { throw "в SRT нет ожидаемых слов" }

      - name: Smoke test, window mode
        shell: pwsh
        run: |
          $p = Start-Process "dist/WHISP_MEDIA_DESK.exe" -PassThru
          $ok = $false
          foreach ($i in 1..90) {
            Start-Sleep -Seconds 1
            try { Invoke-RestMethod "http://127.0.0.1:8765/api/system" | Out-Null; $ok = $true; break } catch {}
          }
          Start-Sleep -Seconds 8
          $p.Refresh()
          "process alive: $(-not $p.HasExited), window handle: $($p.MainWindowHandle)"
          Get-Process WHISP_MEDIA_DESK -ErrorAction SilentlyContinue | Stop-Process -Force
          if (-not $ok) {
            Get-ChildItem dist/logs -ErrorAction SilentlyContinue | ForEach-Object { "== $($_.FullName)"; Get-Content $_.FullName -Tail 40 }
            throw "окно-режим: сервер не ответил"
          }

      - name: Copy docs next to exe
        shell: pwsh
        run: Copy-Item README.md, LICENSE, CHANGELOG.md dist/

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path dist/WHISP_MEDIA_DESK.exe, dist/README.md, dist/LICENSE, dist/CHANGELOG.md -DestinationPath WHISP_MEDIA_DESK-windows.zip

      - name: Installer (Inno Setup)
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" installer\whisp_desk.iss

      - uses: actions/upload-artifact@v4
        with:
          name: WHISP_MEDIA_DESK-windows
          path: |
            WHISP_MEDIA_DESK-windows.zip
            dist/WHISP_MEDIA_DESK.exe
            dist/WHISP_MEDIA_DESK-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/WHISP_MEDIA_DESK.exe
            dist/WHISP_MEDIA_DESK-setup.exe
            WHISP_MEDIA_DESK-windows.zip
          generate_release_notes: true
